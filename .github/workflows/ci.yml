name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @obligon/web lint
      - name: Production build
        run: pnpm --filter @obligon/web build
        env:
          NEXT_PUBLIC_API_URL: ""

  api:
    name: API + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obligon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/obligon_test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm --filter @obligon/api migrate
      - name: Seed
        run: pnpm --filter @obligon/api seed
      - name: Boot API
        run: |
          node src/index.js &
          echo $! > api.pid
          sleep 3
        working-directory: apps/api
      - name: Smoke tests
        run: SMOKE_BASE_URL=http://localhost:4000 pnpm --filter @obligon/api test
      - name: Stop API
        if: always()
        run: kill $(cat api.pid) || true
        working-directory: apps/api
