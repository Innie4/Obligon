services:
  - type: web
    name: obligon-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm --filter @obligon/api migrate
    # Explicit rather than `npm start`: the root `start` script launches the API,
    # so a web service reusing it would build Next.js and then serve the API
    # instead of the site. Naming the package keeps the two apart.
    startCommand: pnpm --filter @obligon/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://obligon.vercel.app
      - key: CORS_ORIGINS
        value: https://obligon.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # Declared under its canonical name too: env.js falls back to the
      # NEXT_PUBLIC_ form, but the production config check requires SUPABASE_URL
      # and relying on that fallback hides a genuinely unset variable.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_AUTH_ENABLED
        value: true
      - key: SUPABASE_STORAGE_BUCKET
        value: obligon
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: REMEMBER_REFRESH_TTL_DAYS
        value: 30
      - key: PROVIDER_HTTP_TIMEOUT_MS
        value: 10000
      - key: PROVIDER_RETRY_COUNT
        value: 2
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: 30000
      - key: DATABASE_MAX_CONNECTIONS
        value: 10
      - key: STRICT_PROVIDERS
        value: true
      - key: ENABLE_SCHEDULER
        value: true
      # ---------------------------------------------------------------- payments
      # Without these the API starts cleanly but every checkout fails with 503
      # "No payment provider is configured". Keep PAYMENT_PROVIDER and its
      # NEXT_PUBLIC mirror in step: the browser needs to know which processor to
      # render a checkout link for.
      - key: PAYMENT_PROVIDER
        value: flutterwave
      - key: NEXT_PUBLIC_PAYMENT_PROVIDER
        value: flutterwave
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      # Must be identical to the Secret Hash in the Flutterwave dashboard, or
      # /api/webhooks/flutterwave rejects every event with 401.
      - key: FLW_SECRET_HASH
        sync: false
      - key: SUDO_BASE_URL
        value: https://api.sandbox.sudo.africa/v1
      - key: SUDO_SECRET_API_KEY
        sync: false
      - key: SUDO_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_CONTACT
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
